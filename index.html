<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Dungeon Brawler</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #231F20; overflow: hidden; }
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(100vw, 160vh); height: min(100vh, 62.5vw); background: #231F20; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
      #unity-logo { width: 154px; height: 130px; background: url('TemplateData/unity-logo-dark.png') no-repeat center; }
      #unity-progress-bar-empty { width: 141px; height: 18px; margin-top: 10px; margin-left: 6.5px; background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center; }
      #unity-progress-bar-full { width: 0%; height: 18px; margin-top: 10px; background: url('TemplateData/progress-bar-full-dark.png') no-repeat center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/DungeonBrawler.data.br",
        frameworkUrl: buildUrl + "/DungeonBrawler.framework.js.br",
        codeUrl: buildUrl + "/DungeonBrawler.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Miluminati",
        productName: "Dungeon Brawler",
        productVersion: "1.0"
      };
      document.querySelector("#unity-loading-bar").style.display = "block";
      var script = document.createElement("script");
      script.src = buildUrl + "/DungeonBrawler.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * p + "%";
        }).then(function () {
          document.querySelector("#unity-loading-bar").style.display = "none";
          try { window.parent.postMessage({ type: "ready" }, "*"); } catch (e) {}
        }).catch(function (m) { alert(m); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
